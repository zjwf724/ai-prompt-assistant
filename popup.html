<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Prompt Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path fill="currentColor" d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
            <circle cx="19" cy="5" r="3"/>
          </svg>
        </div>
        <div class="title-group">
          <h1>AI Prompt Assistant</h1>
          <span class="version">v1.4.1</span>
        </div>
      </div>
      <button class="icon-btn" id="refreshBtn" title="刷新数据">
        <svg viewBox="0 0 20 20" width="16" height="16">
          <path fill="currentColor" d="M15.3 9.3a1 1 0 0 1 .7.3 1 1 0 0 1 0 1.4l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 0 1 1.4-1.4l2.3 2.29V5a1 1 0 0 1 2 0v6.59l2.3-2.3z"/>
        </svg>
      </button>
    </header>

    <!-- 统计卡片 -->
    <section class="stats-section">
      <div class="stat-card">
        <span class="stat-icon">📝</span>
        <div class="stat-info">
          <span class="stat-value" id="totalPrompts">0</span>
          <span class="stat-label">提示词</span>
        </div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">📁</span>
        <div class="stat-info">
          <span class="stat-value" id="totalCategories">0</span>
          <span class="stat-label">分类</span>
        </div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">🌐</span>
        <div class="stat-info">
          <span class="stat-value" id="activeSites">0</span>
          <span class="stat-label">启用网站</span>
        </div>
      </div>
    </section>

    <!-- 快速操作 -->
    <section class="section">
      <div class="section-header">
        <h2>📚 快速操作</h2>
      </div>
      <div class="quick-actions">
        <button class="action-btn primary" id="addPromptBtn">
          <svg viewBox="0 0 20 20" width="16" height="16">
            <path fill="currentColor" d="M10 3a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2h-5v5a1 1 0 1 1-2 0v-5H4a1 1 0 1 1 0-2h5V4a1 1 0 0 1 1-1z"/>
          </svg>
          添加提示词
        </button>
        <button class="action-btn secondary" id="manageCategoriesBtn">
          <svg viewBox="0 0 20 20" width="16" height="16">
            <path fill="currentColor" d="M7 3a1 1 0 0 0 0 2h6a1 1 0 1 0 0-2H7zM4 7a1 1 0 0 0 0 2h12a1 1 0 1 0 0-2H4zM2 11a1 1 0 0 1 1-1h14a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1zM5 15a1 1 0 0 0 0 2h10a1 1 0 1 0 0-2H5z"/>
          </svg>
          管理分类
        </button>
      </div>
    </section>

    <!-- 通用设置 -->
    <section class="section">
      <div class="section-header">
        <h2>⚙️ 通用设置</h2>
      </div>
      <div class="settings-list">
        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-name">显示悬浮球</span>
            <span class="setting-desc">在输入框旁显示快捷操作按钮</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="showIconToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-name">悬浮球位置</span>
            <span class="setting-desc">选择悬浮球显示在页面哪一侧</span>
          </div>
          <div class="radio-group" id="iconPositionGroup">
            <label class="radio-option">
              <input type="radio" name="iconPosition" value="right" checked>
              <span>右侧</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="iconPosition" value="left">
              <span>左侧</span>
            </label>
          </div>
        </div>
      </div>
    </section>

    <!-- 网站管理 -->
    <section class="section sites-section">
      <div class="section-header">
        <h2>🌐 网站管理</h2>
        <button class="text-btn" id="addSiteBtn">+ 添加</button>
      </div>
      <div class="sites-list" id="sitesList">
        <!-- 动态生成 -->
      </div>
    </section>

    <!-- 提示词预览 -->
    <section class="section prompts-section" id="promptsSection">
      <div class="section-header">
        <h2>📋 提示词列表</h2>
        <button class="text-btn danger" id="clearAllBtn">清空全部</button>
      </div>
      <div class="prompts-list" id="promptsList">
        <!-- 动态生成 -->
      </div>
    </section>

    <!-- 数据管理 -->
    <section class="section data-section">
      <div class="section-header">
        <h2>💾 数据管理</h2>
      </div>
      <div class="data-actions">
        <button class="data-btn" id="exportBtn">
          <svg viewBox="0 0 20 20" width="16" height="16">
            <path fill="currentColor" d="M3 8a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1zm0 4a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1zm0 4a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1zm10 2h2a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1z"/>
          </svg>
          导出
        </button>
        <button class="data-btn" id="importBtn">
          <svg viewBox="0 0 20 20" width="16" height="16">
            <path fill="currentColor" d="M3 8a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1zm0 4a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1zm0 4a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1zm10 2h2a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1z"/>
          </svg>
          导入
        </button>
      </div>
    </section>

    <!-- 底部 -->
    <footer class="footer">
      <span>© 2026 AI Prompt Assistant</span>
    </footer>
  </div>

  <!-- 添加提示词对话框 -->
  <div class="modal-overlay" id="addPromptModal">
    <div class="modal">
      <div class="modal-header">
        <h3>添加提示词</h3>
        <button class="modal-close" data-close="addPromptModal">×</button>
      </div>
      <div class="modal-body">
        <form id="addPromptForm">
          <div class="form-group">
            <label>分类</label>
            <select id="categorySelect" class="form-select">
              <option value="">-- 新建分类 --</option>
            </select>
            <input type="text" id="newCategoryInput" class="form-input" placeholder="输入新分类名称" style="display: none;">
          </div>
          <div class="form-group">
            <label>标题</label>
            <input type="text" id="promptTitle" class="form-input" placeholder="简短描述" required>
          </div>
          <div class="form-group">
            <label>内容</label>
            <textarea id="promptContent" class="form-textarea" rows="4" placeholder="提示词内容" required></textarea>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-close="addPromptModal">取消</button>
            <button type="submit" class="btn btn-primary">保存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 管理分类对话框 -->
  <div class="modal-overlay" id="categoryModal">
    <div class="modal">
      <div class="modal-header">
        <h3>管理分类</h3>
        <button class="modal-close" data-close="categoryModal">×</button>
      </div>
      <div class="modal-body">
        <div class="category-list" id="categoryList">
          <!-- 动态生成 -->
        </div>
        <div class="add-category-form">
          <div class="form-row">
            <input type="text" id="newCategoryName" class="form-input" placeholder="新分类名称">
            <button type="button" class="btn btn-primary" id="addCategoryBtn">添加</button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" data-close="categoryModal">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 添加网站对话框 -->
  <div class="modal-overlay" id="addSiteModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3>添加网站</h3>
        <button class="modal-close" data-close="addSiteModal">×</button>
      </div>
      <div class="modal-body">
        <form id="addSiteForm">
          <div class="form-group">
            <label>网站名称</label>
            <input type="text" id="siteName" class="form-input" placeholder="例如：MyAI" required>
          </div>
          <div class="form-group">
            <label>域名</label>
            <input type="text" id="siteHostname" class="form-input" placeholder="例如：chat.z.ai 或 z.ai" required>
            <small>只需域名，不需要 http://。常见AI平台会自动转换为子域名匹配（如 .z.ai）</small>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-close="addSiteModal">取消</button>
            <button type="submit" class="btn btn-primary">添加</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 编辑提示词对话框 -->
  <div class="modal-overlay" id="editPromptModal">
    <div class="modal">
      <div class="modal-header">
        <h3>编辑提示词</h3>
        <button class="modal-close" data-close="editPromptModal">×</button>
      </div>
      <div class="modal-body">
        <form id="editPromptForm">
          <input type="hidden" id="editCategory">
          <input type="hidden" id="editIndex">
          <div class="form-group">
            <label>分类</label>
            <select id="editCategorySelect" class="form-select">
              <!-- 动态生成 -->
            </select>
          </div>
          <div class="form-group">
            <label>标题</label>
            <input type="text" id="editPromptTitle" class="form-input" required>
          </div>
          <div class="form-group">
            <label>内容</label>
            <textarea id="editPromptContent" class="form-textarea" rows="4" required></textarea>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-danger" id="deletePromptBtn">删除</button>
            <div class="modal-actions-right">
              <button type="button" class="btn btn-secondary" data-close="editPromptModal">取消</button>
              <button type="submit" class="btn btn-primary">保存</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 隐藏的文件输入 -->
  <input type="file" id="importFile" accept=".json" style="display: none;">

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <script src="constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
